spring:
#  datasource:
#    url: "jdbc:h2:tcp://localhost/~/dbs/toy_blog"
#    username: "sa"
#    password:
#    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  datasource:
    url: "jdbc:postgresql://localhost:5432/solvelog"
    username: "solvelog_admin"
    password: "solve1234"
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000 #ms
      ssl:
        enabled: false
  #      password:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jpa:
    hibernate:
#      ddl-auto: create
      ddl-auto: none
    properties.hibernate:
      show_sql: true
      format_sql: true
      dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
#    host: smtp.gmail.com
    host: email-smtp.ap-northeast-2.amazonaws.com
    port: 587
#    username: therin234@gmail.com
#    password: ${SMTP_PASSWORD}
    username: ${SES_SMTP_USERNAME}
    password: ${SES_SMTP_PASSWORD}
    properties.mail.smtp:
      auth: true
      timeout: 5000
      starttls.enable: true

  batch.jdbc:
    initialize-schema: embedded

logging.level:
    org.hibernate.sql: debug
#    org.hibernate.type: trace

cookie:
  secure: false
  same-site: Lax

cloud:
  aws:
    s3:
      bucket: ${SOLVELOG_BUCKET}
#      bucket: solvelog-local
    region:
      static: ap-northeast-2
    credentials:
      access-key: ${SOLVELOG_ACCESS_KEY}
      secret-key: ${SOLVELOG_SECRET_KEY}

app:
  base-url: http://localhost:5173

openai:
  api-key: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL:gpt-5-mini}
  connect-timeout-ms: 5000
  read-timeout-ms: 180000

thumbnail:
  worker:
    token: ${THUMBNAIL_WORKER_TOKEN}

jwt:
  secret: ${JWT_SECRET}

monitoring:
  error-event-retention-days: 90
