spring:
#  datasource:
#    url: "jdbc:h2:tcp://localhost/~/dbs/toy_blog"
#    username: "sa"
#    password:
#    driver-class-name: org.h2.Driver
  jackson:
    time-zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  datasource:
#    url: "jdbc:postgresql://localhost:5432/solvelog"
    url: "jdbc:postgresql://postgresdb:5432/solvelog"
    username: "solvelog_admin"
    password: "${SOLVELOG_DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000 #ms
      ssl:
        enabled: false
  #      password:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jpa:
    hibernate:
      ddl-auto: none
    properties.hibernate:
      show_sql: false
      format_sql: false
      dialect: org.hibernate.dialect.PostgreSQLDialect
      jdbc.time_zone: Asia/Seoul

  mail:
    #    host: smtp.gmail.com
    host: email-smtp.ap-northeast-2.amazonaws.com
    port: 587
    #    username: therin234@gmail.com
    #    password: ${SMTP_PASSWORD}
    username: ${SES_SMTP_USERNAME}
    password: ${SES_SMTP_PASSWORD}
    properties.mail.smtp:
      auth: true
      timeout: 5000
      starttls.enable: true

  batch.jdbc:
      initialize-schema: never

logging.level:
    org.hibernate.sql: info
#    org.hibernate.type: trace

cookie:
  secure: true
  same-site: None

cloud:
  aws:
    s3:
      bucket: ${SOLVELOG_BUCKET}
    region:
      static: ap-northeast-2

app:
  base-url: https://www.solvelog.site

openai:
  api-key: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL:gpt-5-mini}
  connect-timeout-ms: 5000
  read-timeout-ms: 180000

thumbnail:
  worker:
    token: ${THUMBNAIL_WORKER_TOKEN}

jwt:
  secret: ${JWT_SECRET}

monitoring:
  error-event-retention-days: 90